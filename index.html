<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTS - Arirang World Tour</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="background-overlay"></div>

  <main class="container">
    <header class="header">
      <span class="sub-title">WORLD TOUR REMINDER</span>
      <h1 class="album-title">아리랑 : ARIRANG</h1>
      <div class="divider"></div>
      <p class="concert-date">13 DE JUNIO, 2027 • SEOUL, SOUTH KOREA</p>
    </header>

    <section class="countdown-section">
      <div class="timer-box">
        <span id="days">00</span>
        <label>Días</label>
      </div>
      <div class="timer-box">
        <span id="hours">00</span>
        <label>Horas</label>
      </div>
      <div class="timer-box">
        <span id="minutes">00</span>
        <label>Minutos</label>
      </div>
      <div class="timer-box">
        <span id="seconds">00</span>
        <label>Segundos</label>
      </div>
    </section>

    <section class="card">
      <h2>Detalles del Evento</h2>
      <ul>
        <li><strong>Lugar:</strong> Estadio Olímpico de Seúl</li>
        <li><strong>Apertura de puertas:</strong> 17:00 KST</li>
        <li><strong>Venta de boletos:</strong> Interpark Ticket</li>
      </ul>
      <button class="btn-reminder" onclick="alert('¡Recordatorio guardado!')">Agregar a mi Calendario</button>
    </section>
  </main>

  <script>
    // Configura la fecha del concierto aquí
    const concertDate = new Date("June 13, 2027 19:00:00").getTime();

    const updateTimer = () => {
      const now = new Date().getTime();
      const difference = concertDate - now;

      if (difference > 0) {
        document.getElementById("days").innerText = Math.floor(difference / (1000 * 60 * 60 * 24));
        document.getElementById("hours").innerText = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById("minutes").innerText = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById("seconds").innerText = Math.floor((difference % (1000 * 60)) / 1000);
      }
    };

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
